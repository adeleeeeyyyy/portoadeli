<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="./assets/images/icons8-circled-a-100.png" type="image/x-icon">
    <meta property="og:title" content="Adeli anonymous message">
    <meta property="og:description" content="Send Me Anonymous Messages">
    <meta property="og:url" content="https://adeli.my.id/anonymous">
    <meta property="og:type" content="website">
    
</head>
<body class="bg-gradient-to-br from-pink-300 to-violet-600 h-screen flex justify-center items-center">
    <div class="bg-white/20 backdrop-blur-lg w-[24rem] p-6 rounded-lg shadow-lg text-center border border-white/30">
        <!-- Komponen Alert -->
        <div id="alert" class="hidden mb-4 p-4 rounded-lg text-sm font-semibold" role="alert"></div>

        <!-- Judul Form -->
        <h1 class="text-2xl font-bold text-white mb-4">Send Me Anonymous Messages</h1>
        <p class="text-sm text-white/80 mb-6">Feel free to share anything! It's completely anonymous.</p>
        
        <!-- Formulir -->
        <form id="messageForm" class="space-y-4">
            <textarea 
                name="content" 
                placeholder="Write your anonymous message here..." 
                class="w-full h-[8rem] p-4 rounded-lg border border-white/40 bg-white/30 text-white placeholder-white/70 focus:outline-none focus:ring-2 focus:ring-pink-300"
                required
            ></textarea>
            <button 
                type="submit" 
                class="w-full bg-pink-500 text-white py-2 rounded-lg font-semibold hover:bg-pink-600 transition duration-300">
                Send Message
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById('messageForm');
        const alertBox = document.getElementById('alert');

        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // Cegah form melakukan submit default
            
            const content = form.content.value;

            try {
                const response = await fetch('https://d530-103-47-133-77.ngrok-free.app/api/v1/content/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ content }),
                });

                if (response.ok) {
                    const result = await response.json();
                    showAlert('Message sent successfully!', 'success');
                    form.reset(); // Reset form setelah sukses
                } else {
                    showAlert('Failed to send message. Please try again.', 'error');
                }
            } catch (error) {
                showAlert('An error occurred. Please check your connection.', 'error');
            }
        });

        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.className = `mb-4 p-4 rounded-lg text-sm font-semibold ${
                type === 'success' 
                ? 'bg-green-100 text-green-800 border border-green-300'
                : 'bg-red-100 text-red-800 border border-red-300'
            }`;
            alertBox.classList.remove('hidden');

            setTimeout(() => {
                alertBox.classList.add('hidden');
            }, 3000); // Sembunyikan alert setelah 3 detik
        }
    </script>
</body>
</html>
