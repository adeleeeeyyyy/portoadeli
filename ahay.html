<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recently Played Songs</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#dd3431] text-white p-6 flex justify-center">
    <div class="shadow-[5px_5px_0px_0px_rgba(255, 255, 255, 1)]">
        <div class="bg-[#fdda0c] rounded-xl pr-10 pb-4 pt-4 pl-0 w-[80rem] max-w-lg border-4 border-black">
            <div id="songs" class="space-y-4"></div>
        </div>
    </div>
    
    <script>
        const TOKEN = "BQBd35jzvaJgOvKJzc_9DgfnMxriteBGbq6tK0e6i9VkTmOiRhlsrnJoiK0R52dlvjNSqDwD3DMvV4NUcqquUdPKuAPhuYp3u3yeVEgJ-pxWzwm7IBvkkc9HRTBnBxTYCm3NcpMtXJfX_bVtAD1JNfuc-B6lXUnHtq8OyyApvA2PshAZ124sK573Es3311PY_GFqwZ3icKtL71S0o9YeulLl-2UUzMShQvdJ6RqUyvk";  // Ganti dengan Access Token Spotify yang sudah kamu punya

        // **🔹 Fetch Recently Played Songs dari Spotify**
        async function fetchRecentlyPlayed() {
            const response = await fetch("https://api.spotify.com/v1/me/player/recently-played?limit=5", {
                headers: { "Authorization": `Bearer ${TOKEN}` }
            });

            const data = await response.json();
            displayTracks(data.items);
        }

        // **🔹 Tampilkan Lagu di UI**
        function displayTracks(tracks) {
            const songContainer = document.getElementById("songs");
            songContainer.innerHTML = "";

            tracks.forEach(item => {
                const track = item.track;
                const songHTML = `
                    <div class="border-b-4 border-black">
                        <div class="p-4 rounded-lg  flex items-center">
                            <div class="shadow-[3px_3px_0px_0px_rgba(0,0,0)] rounded-2lg">
                                <img src="${track.album.images[0].url}" alt="Album Art" class="w-[5rem] h-[5rem]  rounded-lg">
                            </div>
                            <div class="ml-4 flex-1">
                                <h2 class="text-lg font-bold text-black">${track.name}</h2>
                                <p class="text-black">${track.artists.map(artist => artist.name).join(", ")}</p>
                            </div>
                            <a href="${track.external_urls.spotify}" target="_blank" class="text-black">🎵</a>
                        </div>
                    </div>
                `;
                songContainer.innerHTML += songHTML;
            });
        }

        // **🔹 Jalankan Fetch**
        fetchRecentlyPlayed();
    </script>
</body>
</html>
