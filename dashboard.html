<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Messages</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="./assets/images/icons8-circled-a-100.png" type="image/x-icon">
</head>
<body class="bg-gradient-to-br from-pink-300 to-violet-600 min-h-screen p-8">
    <div class="container mx-auto">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white">Messages Dashboard</h1>
            <p class="text-white/80 mt-2">View all anonymous messages here</p>
        </div>

        <!-- Messages Container -->
        <div id="messages" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Message Cards Will Be Injected Here -->
        </div>

        <div id="loader" class="text-center mt-12">
            <span class="text-white text-xl">Loading messages...</span>
        </div>

        <div id="errorAlert" class="hidden text-center mt-12">
            <span class="text-red-500 font-semibold">Failed to fetch messages. Please try again later.</span>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('messages');
        const loader = document.getElementById('loader');
        const errorAlert = document.getElementById('errorAlert');

        async function fetchMessages() {
            try {
                const response = await fetch('https://d530-103-47-133-77.ngrok-free.app/api/v1/content/show', {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include', // Tambahkan opsi kredensial
                });
                
                if (!response.ok) {
                    throw new Error('Failed to fetch messages');
                }

                const data = await response.json();
                displayMessages(data.data);
            } catch (error) {
                console.error(error);
                showError();
            } finally {
                loader.classList.add('hidden');
            }
        }

        function displayMessages(messages) {
            if (!messages.length) {
                messagesContainer.innerHTML = `
                    <div class="col-span-full text-center text-white/80">
                        No messages found.
                    </div>`;
                return;
            }

            messagesContainer.innerHTML = messages.map(message => `
                <div class="bg-white/30 backdrop-blur-lg p-4 rounded-lg shadow-lg border border-white/20">
                    <h2 class="text-lg font-semibold text-white mb-2">Message ID: ${message.content_id}</h2>
                    <p class="text-sm text-white/80">${message.content}</p>
                </div>
            `).join('');
        }

        function showError() {
            errorAlert.classList.remove('hidden');
        }

        fetchMessages();
    </script>
</body>
</html>
